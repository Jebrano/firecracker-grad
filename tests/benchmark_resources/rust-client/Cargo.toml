[package]
name = "fc-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP over Unix sockets
hyper = { version = "0.14", features = ["http1", "client"] }
hyperlocal = "0.8"
tokio = { version = "1", features = ["full"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI args
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
