[package]
name = "def-jailer-bench"
version = "0.1.0"
authors = ["Jubran Almarri"]
edition = "2024"
description = "This is a custom test benchmarking tool."
license = "Apache-2.0"

[[bin]]
name = "def-jailer-bench"

[lib]
name = "jailer_client"
path = "src/lib.rs"

[dependencies]
hyper = {version = "1.9.0", features = ["http1", "client"]}
hyperlocal = "0.9.1"
hyper-util = {version = "0.1.20", features = ["client", "http1"]}
hyper-client-sockets = "0.6.0"
http-body-util = "0.1.3"
bytes = "1.11.1"
tokio = { version = "1.52.3", features = ["full"] }

# JSON
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# CLI args
clap = { version = "4.6.1", features = ["derive"] }

# Error handling
anyhow = "1.0.102"

[lints]
workspace = true
