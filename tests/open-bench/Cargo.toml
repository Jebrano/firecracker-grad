[package]
name = "open-bench"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "open-bench"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
landlock = "0.4.5"
nix = { version = "0.29", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
